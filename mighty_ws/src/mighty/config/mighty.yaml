extends: params/mighty_node.yaml
mighty_node:
  ros__parameters:
    sim_env: fake_sim
    planning_mode: global_once
    map_mode: known_pcd
    visual_level: 2
    v_max: 2.0
    a_max: 5.0
    j_max: 10.0
    w_max: 1.0
    drone_bbox:
    - 0.5
    - 0.5
    - 0.5
    shape_aware_astar.shape: t
known_maps:
  hole:
    id: hole
    shape_set: small
    pcd_path: ../maps/hole.pcd
    frame_id: map
    resolution: 0.1
    bounds:
      min:
      - -7.6
      - -7.6
      - 0.0
      max:
      - 7.6
      - 7.6
      - 3.0
    visualization:
      polymap_path: ../maps/polymap/hole.polymap.json
  forest:
    id: forest
    shape_set: normal
    pcd_path: ../maps/forest.pcd
    frame_id: map
    resolution: 0.1
    bounds:
      min:
      - -15.0
      - -15.0
      - -0.1
      max:
      - 15.0
      - 15.0
      - 4.0
    visualization:
      polymap_path: ../maps/polymap/forest.polymap.json
  narrow:
    id: narrow
    shape_set: normal
    pcd_path: ../maps/narrow.pcd
    frame_id: map
    resolution: 0.1
    bounds:
      min:
      - -10.0
      - -2.0
      - -0.3
      max:
      - 10.0
      - 2.0
      - 3.3
    visualization:
      polymap_path: ../maps/polymap/narrow.polymap.json
      boundary_solids:
      - name: floor
        z:
        - -0.2
        - 0.0
      - name: ceiling
        z:
        - 3.0
        - 3.2
  block:
    id: block
    shape_set: normal
    pcd_path: ../maps/block.pcd
    frame_id: map
    resolution: 0.1
    default_start:
    - 0.0
    - 0.0
    - 1.5
    bounds:
      min:
      - -7.5
      - -7.5
      - 0.0
      max:
      - 7.5
      - 7.5
      - 3.0
    visualization:
      polymap_path: ../maps/polymap/block.polymap.json
